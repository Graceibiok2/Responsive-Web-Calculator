<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./calculator/index.css">
</head>
<body>
    <main id="calculator">
        <div id="display" role="status" aria-live="polite">0</div>
 
        <div id="buttons">
            <button type="button" data-action="clear" class="function-btn">C</button>
            <button type="button" data-action="delete" class="function-btn" aria-label="Delete last character">&larr;</button>
            <button type="button" data-value="÷" class="operator-btn" aria-label="Divide">÷</button>
            <button type="button" data-value="×" class="operator-btn" aria-label="Multiply">×</button>
 
            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button type="button" data-value="−" class="operator-btn" aria-label="Subtract">−</button>
 
            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" data-value="+" class="operator-btn" aria-label="Add">+</button>
 
            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" data-action="equals" class="equals-btn" aria-label="Equals">=</button>
 
            <button type="button" data-value="0" class="zero-btn">0</button>
            <button type="button" data-value=".">.</button>
        </div>
    </main>
 
    <script src="./calculator/index.js"></script>
</body>
</html>
